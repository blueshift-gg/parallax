[package]
name = "parallax-svm-derive"
description = "Attribute macro for parallax-svm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["solana", "litesvm", "testing", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers", "development-tools::testing"]
include = ["/src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
proc-macro = true
doctest = false

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"
