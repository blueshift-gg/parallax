[package]
name = "parallax-svm"
description = "Parallax: a fixture-based testing harness for Solana programs on LiteSVM"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["solana", "testing", "svm", "litesvm", "blockchain"]
categories = ["development-tools", "development-tools::testing"]
include = ["/src/**", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "parallax_svm"
doctest = true

[features]
# `native-rpc` bundles a minimal HTTPS JSON-RPC transport (ureq + rustls) so a
# native Rust test can fill the `Dump` store from mainnet on a miss without any
# extra wiring. It is a default feature for the crate, but the FFI cdylib
# depends on the core with `default-features = false`: the TypeScript harness
# supplies its own JS `fetch` transport, so the shipped binary carries no TLS
# stack and never opens a socket (see the boundary note in `src/dump.rs`).
default = ["native-rpc"]
native-rpc = ["dep:ureq"]

[dependencies]
base64 = "0.22"
litesvm = { version = "0.15", features = ["persistence-internal"] }
parallax-svm-derive = { path = "derive", version = "=0.1.0" }
serde_json = "1"
solana-account = "4.3"
# wincode-line skew (see Cargo.lock): litesvm 0.15 is built against the solana
# sysvar crates that still use wincode 0.5.x. Their next patch releases bump to
# wincode 0.6.0, whose `SchemaRead`/`SchemaWrite`/`Reader` traits are a distinct
# incompatible line — mixing the two makes solana-nonce's derive fail to
# compile. `solana-clock = "=3.1.1"` is the one such crate depended on directly;
# the rest are held on the wincode-0.5 line by precise Cargo.lock entries
# (solana-address 2.6.1, solana-hash 4.5.0, solana-nonce 3.2.0, solana-message
# 4.3.0, solana-short-vec 3.2.2, solana-last-restart-slot 3.1.0,
# solana-slot-history 3.1.0, solana-epoch-rewards 3.1.0, solana-slot-hashes
# 3.1.0), matching litesvm 0.15's own lockfile. wincode resolves to a single
# 0.5.x — verify with `cargo tree -i wincode`.
solana-clock = "=3.1.1"
solana-compute-budget = "4.1"
solana-fee-structure = "3"
solana-instruction = "3.4"
solana-instruction-error = "2.4"
solana-message = "4"
solana-pubkey = { version = "4.2", features = ["curve25519"] }
solana-rent = "4.2"
solana-sdk-ids = "3.1"
solana-signature = "3.4"
solana-transaction = "4.1"
solana-transaction-error = "3.3"
spl-token = { version = "=9.0.0", default-features = false, features = ["no-entrypoint"] }
# Optional native transport for `Dump` misses: a small HTTPS JSON-RPC client.
# ureq is the lean choice — one blocking `POST`, rustls for TLS (mainnet RPC is
# HTTPS, so a hand-rolled std::net client cannot reach it), no async runtime and
# no heavyweight Solana SDK. Gated behind `native-rpc` and excluded from the FFI
# build entirely.
ureq = { version = "2.12", optional = true, default-features = false, features = ["tls"] }
# wincode 0.5 is the serialization substrate: a standard, not a framework. The
# typed-state API (`read`/`read_at`/`write`/`has_state`) decodes and encodes an
# account's data with wincode's `DefaultConfig`; the `Dump`/`Load` file format is
# also wincode-derived, so a dumped file IS a shareable, loadable artifact.
wincode = { version = "0.5", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[workspace]
members = ["derive", "ffi"]

# Panic strategy is load-bearing for FFI soundness, not a tuning knob.
#
# The `parallax-svm-ffi` boundary (ffi/src/ffi.rs) wraps every extern entry
# point in `catch_unwind` so a panic in the harness becomes a status code
# instead of unwinding across the C ABI — which would be undefined behavior.
# That proof holds only under `panic = "unwind"`: with `panic = "abort"` a
# panic aborts the whole process (taking the C host down) before `catch_unwind`
# can convert it, so the boundary's safety guarantee silently evaporates.
#
# Unwind is already the toolchain default; pinning it here makes the FFI
# invariant explicit and tamper-evident. The shipped cdylib builds under
# `--release` (see Makefile); `dev` is pinned too so the in-process FFI tests
# exercise the same strategy. Do not change these to `abort` without first
# removing the `catch_unwind` boundary and its safety proofs.
[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blueshift-gg/parallax"
homepage = "https://github.com/blueshift-gg/parallax"
authors = ["Leonardo Donatacci <leo@blueshift.gg>", "Dean Little <dean@blueshift.gg>"]
